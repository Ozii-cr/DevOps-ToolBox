name: Terraform CI/CD

on:
  workflow_dispatch:  
  push:
    branches:
      - main
      - staging/*
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest
    defaults:
        run:
          shell: bash
          working-directory: .

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_BASE64 }}


    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    
    - name: Terraform Init
      run: |
         terraform init \
         -backend-config="bucket=${{ secrets.BACKEND_BUCKET }}" \
         -backend-config="prefix=${{ secrets.PREFIX}}"

    - name: Terraform format
      id: fmt
      run: terraform fmt -check

    - name: Terraform validate
      id: validate
      run: terraform validate

    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color -input=false -out planfile
      continue-on-error: true
      env:
        TF_VAR_project_id: ${{ secrets.PROJECT_ID }}
        TF_VAR_vpc_name: ${{ secrets.VPC_NAME }}
        TF_VAR_ssh_username: ${{ secrets.SSH_USERNAME }}
        TF_VAR_ssh_public_key_devops: ${{ secrets.PUBLIC_KEY_DEVOPS }}


    - name: Terraform plan status
      if: steps.plan.outcome == 'failure' 
      run: exit 1     

    - name: Terraform Apply
      id: apple
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -lock-timeout=300s -parallelism=1 planfile
      env:
        TF_VAR_project_id: ${{ secrets.PROJECT_ID }}
        TF_VAR_vpc_name: ${{ secrets.VPC_NAME }}